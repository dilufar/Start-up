services:
  db:
    image: postgres:16-alpine
    container_name: voiceshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voiceshop
      POSTGRES_PASSWORD: voiceshop_dev_password
      POSTGRES_DB: voiceshop
    ports:
      - "5432:5432"
    volumes:
      - voiceshop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceshop -d voiceshop"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  voiceshop_pgdata:
